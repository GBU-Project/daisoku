<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="color-scheme" content="light dark">
<title>Scan UMKM</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- TAB: SCAN -->
<section id="tab-scan" class="tab active">
  <header class="bar">
    <h1>📷 Scan</h1>
    <div class="bar-actions">
      <button id="btn-torch" class="icon-btn" title="Senter" hidden>🔦</button>
      <button id="btn-switch" class="icon-btn" title="Ganti kamera" hidden>🔄</button>
    </div>
  </header>

  <div class="viewfinder">
    <div id="reader"></div>
    <div class="frame" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
    <p id="scan-hint" class="hint" hidden>Arahkan ke barcode / QR code</p>
  </div>

  <div class="row">
    <button id="btn-start" class="btn primary">▶ Mulai Scan</button>
    <button id="btn-file" class="btn">🖼 Dari Foto</button>
    <input id="file-input" type="file" accept="image/*" hidden>
  </div>

  <!-- Input manual -->
  <form id="manual-form" class="manual-row">
    <input id="manual-input" type="text" inputmode="text" placeholder="Ketik kode manual…" autocomplete="off">
    <button class="btn" type="submit">OK</button>
  </form>
</section>

<!-- TAB: RIWAYAT -->
<section id="tab-history" class="tab">
  <header class="bar">
    <h1>🕘 Riwayat</h1>
    <div class="bar-actions">
      <button id="btn-export-csv" class="btn small">⬇ CSV</button>
      <button id="btn-export-json" class="btn small">⬇ JSON</button>
      <button id="btn-import" class="btn small">⬆ Impor</button>
      <input id="import-input" type="file" accept="application/json,.json" hidden>
      <button id="btn-clear" class="btn small danger">🗑</button>
    </div>
  </header>
  <input id="search" type="search" placeholder="Cari kode…">
  <p id="history-count" class="muted"></p>
  <ul id="history-list" class="list"></ul>
  <p id="history-empty" class="empty" hidden>Belum ada data scan.</p>
</section>

<!-- BOTTOM NAV -->
<nav class="tabbar">
  <button data-tab="scan" class="active"><span>📷</span>Scan</button>
  <button data-tab="history"><span>🕘</span>Riwayat</button>
</nav>

<!-- DIALOG: Input QTY setelah scan -->
<dialog id="qty-dialog">
  <form method="dialog" class="sheet">
    <p id="dlg-format" class="muted-sm"></p>
    <p id="dlg-code" class="code-big"></p>
    <label class="field-label">Jumlah (QTY)
      <div class="qty-row">
        <button type="button" id="qty-minus" class="qty-btn">−</button>
        <input id="qty-input" type="number" inputmode="numeric" min="1" value="1" class="qty-field">
        <button type="button" id="qty-plus" class="qty-btn">+</button>
      </div>
    </label>
    <label class="field-label" style="margin-top:10px">Catatan (opsional)
      <input id="dlg-note" type="text" placeholder="Nama produk, harga…" class="note-input">
    </label>
    <div class="row" style="margin-top:16px">
      <button class="btn primary" value="save">✔ Simpan</button>
      <button class="btn" value="close">✕ Batal</button>
    </div>
  </form>
</dialog>

<div id="toast" role="status" aria-live="polite"></div>

<script src="vendor/html5-qrcode.min.js"></script>
<script src="app.js"></script>
</body>
</html>
