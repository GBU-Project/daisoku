<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="color-scheme" content="light dark">
<title>Scan UMKM</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <!-- SCAN -->
  <section id="tab-scan" class="tab active" aria-label="Scan">
    <header class="bar"><h1>Scan</h1>
      <div class="bar-actions">
        <button id="btn-torch" class="icon-btn" title="Senter" hidden>🔦</button>
        <button id="btn-switch" class="icon-btn" title="Ganti kamera" hidden>🔄</button>
      </div>
    </header>
    <div class="viewfinder">
      <div id="reader"></div>
      <div class="frame" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
      <p id="scan-hint" class="hint">Arahkan kamera ke barcode atau QR</p>
    </div>
    <div class="row">
      <button id="btn-start" class="btn primary">Mulai Scan</button>
      <button id="btn-file" class="btn">Dari Foto</button>
      <input id="file-input" type="file" accept="image/*" hidden>
    </div>
    <form id="manual-form" class="manual">
      <input id="manual-input" type="text" inputmode="text" placeholder="Ketik kode manual" autocomplete="off">
      <button class="btn" type="submit">Simpan</button>
    </form>
    <label class="check"><input type="checkbox" id="opt-continuous"> Scan terus-menerus</label>
    <label class="check"><input type="checkbox" id="opt-beep" checked> Bunyi &amp; getar saat berhasil</label>
  </section>

  <!-- RIWAYAT -->
  <section id="tab-history" class="tab" aria-label="Riwayat">
    <header class="bar"><h1>Riwayat</h1>
      <div class="bar-actions">
        <button id="btn-export" class="btn small">Ekspor CSV</button>
        <button id="btn-clear" class="btn small danger">Hapus Semua</button>
      </div>
    </header>
    <input id="search" type="search" placeholder="Cari kode atau catatan…">
    <p id="history-count" class="muted"></p>
    <ul id="history" class="list"></ul>
    <p id="history-empty" class="empty" hidden>Belum ada hasil scan.</p>
  </section>

  <!-- BUAT -->
  <section id="tab-create" class="tab" aria-label="Buat">
    <header class="bar"><h1>Buat Kode</h1></header>
    <label class="field">Jenis
      <select id="gen-type">
        <option value="QR">QR Code</option>
        <option value="CODE128">Code 128</option>
        <option value="EAN13">EAN-13</option>
        <option value="EAN8">EAN-8</option>
        <option value="UPC">UPC-A</option>
        <option value="CODE39">Code 39</option>
      </select>
    </label>
    <label class="field">Isi / Nomor
      <input id="gen-text" type="text" placeholder="Contoh: 8991234567890" autocomplete="off">
    </label>
    <label class="field">Label di bawah kode (opsional)
      <input id="gen-label" type="text" placeholder="Contoh: Keripik Singkong 250g – Rp12.000">
    </label>
    <p id="gen-error" class="error" hidden></p>
    <div id="gen-preview" class="preview"></div>
    <div class="row">
      <button id="btn-gen-save" class="btn primary" disabled>Unduh PNG</button>
      <button id="btn-gen-print" class="btn" disabled>Cetak</button>
    </div>
  </section>
</main>

<!-- Hasil scan -->
<dialog id="result-dialog">
  <form method="dialog" class="sheet">
    <h2>Hasil Scan</h2>
    <p id="res-format" class="muted"></p>
    <p id="res-text" class="res-text"></p>
    <a id="res-link" class="btn" target="_blank" rel="noopener" hidden>Buka tautan</a>
    <label class="field">Catatan
      <input id="res-note" type="text" placeholder="Nama produk, harga, dll.">
    </label>
    <div class="row">
      <button id="res-copy" type="button" class="btn">Salin</button>
      <button id="res-save" class="btn primary" value="save">Simpan</button>
      <button class="btn" value="close">Tutup</button>
    </div>
  </form>
</dialog>

<nav class="tabbar" aria-label="Navigasi">
  <button data-tab="scan" class="active"><span>📷</span>Scan</button>
  <button data-tab="history"><span>🕘</span>Riwayat</button>
  <button data-tab="create"><span>➕</span>Buat</button>
</nav>

<div id="toast" role="status" aria-live="polite"></div>

<script src="vendor/html5-qrcode.min.js"></script>
<script src="vendor/JsBarcode.all.min.js"></script>
<script src="vendor/qrcode.js"></script>
<script src="app.js"></script>
</body>
</html>
