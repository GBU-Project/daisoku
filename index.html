<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111">
<meta name="color-scheme" content="dark light">
<title>Scan UMKM</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- KAMERA -->
<div class="cam-wrap">
  <div id="reader"></div>
  <div class="cam-frame"><span></span><span></span><span></span><span></span></div>
  <div class="cam-top-bar">
    <button id="btn-torch" class="cam-btn" title="Senter" hidden>🔦</button>
    <button id="btn-switch" class="cam-btn" title="Ganti kamera" hidden>🔄</button>
  </div>
  <button id="btn-start" class="cam-start">▶ Mulai Scan</button>
</div>

<!-- TABEL ITEM -->
<div class="table-wrap">
  <div class="table-header">
    <span class="th-item">Item <span id="item-count" class="count"></span></span>
    <button id="btn-add" class="add-btn">＋ Add</button>
    <span class="th-qty">Qty</span>
  </div>

  <ul id="item-list" class="item-list"></ul>
  <p id="list-empty" class="empty">Belum ada item. Mulai scan atau tap ＋ Add.</p>
</div>

<!-- BOTTOM BAR -->
<div class="bottom-bar">
  <button id="btn-clear" class="bot-btn danger">🗑 Hapus</button>
  <button id="btn-export" class="bot-btn">⬇ CSV</button>
  <button id="btn-export-json" class="bot-btn">⬇ JSON</button>
  <button id="btn-import" class="bot-btn">⬆ Impor</button>
  <input id="import-input" type="file" accept=".json,application/json" hidden>
</div>

<!-- DIALOG: manual add -->
<dialog id="add-dialog">
  <form method="dialog" class="sheet">
    <h3>Tambah Manual</h3>
    <input id="add-code" type="text" placeholder="Kode barcode / nama produk" autocomplete="off" class="inp">
    <label class="lbl">QTY
      <div class="qty-row">
        <button type="button" id="add-minus" class="qty-btn">−</button>
        <input id="add-qty" type="number" inputmode="numeric" min="1" value="1" class="qty-field">
        <button type="button" id="add-plus" class="qty-btn">＋</button>
      </div>
    </label>
    <div class="dlg-row">
      <button class="btn primary" value="save">✔ Simpan</button>
      <button class="btn" value="close">✕</button>
    </div>
  </form>
</dialog>

<!-- DIALOG: edit QTY -->
<dialog id="edit-dialog">
  <form method="dialog" class="sheet">
    <h3>Koreksi QTY</h3>
    <p id="edit-code" class="edit-code"></p>
    <label class="lbl">QTY
      <div class="qty-row">
        <button type="button" id="edit-minus" class="qty-btn">−</button>
        <input id="edit-qty" type="number" inputmode="numeric" min="0" value="1" class="qty-field">
        <button type="button" id="edit-plus" class="qty-btn">＋</button>
      </div>
    </label>
    <p class="hint-txt">Set ke 0 untuk hapus item ini.</p>
    <div class="dlg-row">
      <button class="btn primary" value="save">✔ Simpan</button>
      <button class="btn" value="close">✕ Batal</button>
    </div>
  </form>
</dialog>

<div id="toast" role="status" aria-live="polite"></div>

<script src="vendor/html5-qrcode.min.js"></script>
<script src="app.js"></script>
</body>
</html>
